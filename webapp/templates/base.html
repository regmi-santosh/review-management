<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Tend — Live demo{% endblock %}</title>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F5F6F9;
    --text: #0E1116;
    --text-2: #5B6270;
    --accent: #4F46E5;
    --line: #E7E9EF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0D10;
      --surface: #15181E;
      --text: #EDEEF2;
      --text-2: #9AA2B1;
      --accent: #8280F5;
      --line: #23262E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
  }
  h1, h2 { font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; }
  p { margin: 0 0 16px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px; }
  a.btn, button.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.98rem;
    padding: 13px 24px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  a.btn:hover, button.btn:hover { opacity: 0.9; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .muted { color: var(--text-2); font-size: 0.92rem; }
  input[type=text], input[type=email] {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
  }
  img.quote-card { width: 100%; border-radius: 8px; margin: 12px 0; }
  .badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text-2);
    margin-left: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
