[project]
name = "review-management"
version = "0.1.0"
description = "Core review-handling pipeline: fetch/classify/draft/route/post Google reviews, plus social and notification helpers. Packaged so the platform's MCP servers (review-mcp, social-mcp, notification-mcp) can depend on lib/ directly instead of re-shelling-out and re-parsing text output for logic that's already a plain function call."
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
